name: Release

# Tag a commit (v1.0.0) and this publishes a Mac app and an Android APK to the
# release, so people can install Tethr without a compiler on their machine.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mac:
    name: Build Tethr.app
    # macOS 26 runner: the app's deployment target is macOS 26, which needs
    # the matching SDK. The older image cannot build it.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      - name: Build and assemble the app bundle
        run: ./scripts/build-mac.sh
      # ditto, not zip: it preserves the bundle's symlinks and the code
      # signature, which a plain zip quietly corrupts.
      - name: Package
        run: |
          ditto -c -k --keepParent mac/Tethr.app Tethr-macOS.zip
          # Printed so the Homebrew cask's sha256 can be updated from the log
          # without downloading the artifact again.
          echo "::notice title=Cask sha256::$(shasum -a 256 Tethr-macOS.zip | cut -d' ' -f1)"
      - uses: actions/upload-artifact@v7
        with:
          name: mac
          path: Tethr-macOS.zip

  android:
    name: Build the APK
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
      - name: Run wire-format tests
        run: cd android && ./gradlew testDebugUnitTest
      # Signed with a real key when the repo has one, so the published APK is
      # not a debuggable build. Without the secrets it falls back to debug and
      # says so in the filename, rather than publishing something uninstallable.
      - name: Decode signing key
        if: env.KEYSTORE_BASE64 != ''
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tethr.jks"
      - name: Build
        env:
          TETHR_KEYSTORE: ${{ secrets.KEYSTORE_BASE64 != '' && format('{0}/tethr.jks', runner.temp) || '' }}
          TETHR_KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          TETHR_KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          TETHR_KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          cd android
          if [ -n "$TETHR_KEYSTORE" ]; then
            ./gradlew assembleRelease
            cp app/build/outputs/apk/release/*.apk ../Tethr-android.apk
          else
            echo "::warning::No signing secrets set — publishing a debug build."
            ./gradlew assembleDebug
            cp app/build/outputs/apk/debug/*.apk ../Tethr-android-debug.apk
          fi
      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: Tethr-android*.apk

  publish:
    name: Attach to the release
    needs: [mac, android]
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - uses: actions/download-artifact@v8
        with: { path: dist }
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/**/*
          generate_release_notes: true
