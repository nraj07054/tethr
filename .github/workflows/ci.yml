name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: android-actions/setup-android@v3
      # These pin the encrypted wire format against the Mac's Swift
      # implementation. If they fail, the two ends can no longer talk.
      - run: cd android && ./gradlew testDebugUnitTest assembleDebug

  mac:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: swift build --package-path mac -c release
